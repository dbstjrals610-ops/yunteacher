<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>과학자의 신념을 지켜라</title>
<style>
:root{
  --bg:#07101d;--panel:#0f1a2d;--panel2:#152640;--line:#2a3c5c;
  --text:#eef6ff;--muted:#9caec8;--accent:#6ba8ff;--good:#5fdda0;
  --bad:#ff7184;--gold:#ffd66e;--violet:#aa8cff;--cyan:#60dff5
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,#274671 0,rgba(16,35,62,.75) 24%,transparent 55%),
    linear-gradient(180deg,#08111f,#060d16 80%);
}
button{font:inherit;cursor:pointer}
.wrap{max-width:1230px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.brand{font-weight:900;letter-spacing:.3px}
.sound{border:1px solid var(--line);background:#0e192a;color:#e1ecfb;border-radius:12px;padding:8px 11px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.main,.side{
  background:rgba(15,26,45,.96);border:1px solid var(--line);border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden
}
.side{position:sticky;top:12px}
.hero{padding:56px 34px 48px;text-align:center}
.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:2.2px}
.hero h1{font-size:clamp(36px,5.8vw,66px);line-height:1.02;margin:13px 0 17px}
.hero p{max-width:720px;margin:0 auto 24px;color:var(--muted);line-height:1.8}
.pills{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 28px}
.pill{padding:8px 11px;border:1px solid var(--line);background:#0c1728;border-radius:999px;color:#cad9ed;font-size:12px}
.btn{
  border:0;border-radius:14px;padding:13px 20px;background:var(--accent);color:#06111f;
  font-weight:900;transition:.15s
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.ghost{background:#152640;color:var(--text);border:1px solid var(--line)}
.content{padding:26px}
.stageLine{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.stageLine b{color:#edf5ff}
.title{font-size:34px;line-height:1.22;margin:9px 0 4px}
.subtitle{font-weight:900;color:var(--accent)}
.story{font-size:18px;line-height:1.85;color:#dce8f7;margin:18px 0}
.quote{
  border-left:3px solid var(--gold);background:#0c1728;padding:13px 16px;
  border-radius:0 13px 13px 0;color:#e8f1fd;line-height:1.7;margin:18px 0
}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:19px}
.choice{
  background:#13233b;color:var(--text);border:1px solid var(--line);text-align:left;
  border-radius:16px;padding:16px;min-height:92px;transition:.15s
}
.choice:hover{background:#182d4c;border-color:#6ea9ff;transform:translateY(-2px)}
.choice small{display:block;margin-top:6px;color:#9fb0c9}
.quizhead{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.progress{height:8px;background:#09121f;border-radius:999px;overflow:hidden;margin:11px 0 20px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));transition:.35s}
.question{font-size:23px;line-height:1.5;margin:14px 0 18px}
.answers{display:grid;gap:10px}
.answer{
  position:relative;background:#13233b;color:var(--text);border:1px solid var(--line);
  border-radius:15px;padding:15px;text-align:left;min-height:67px
}
.answer:hover{background:#192e4d;border-color:#6da9ff}
.answer.correct{background:#103228;border-color:var(--good)}
.answer.wrong{background:#3a1821;border-color:var(--bad)}
.tag{font-size:11px;background:#091523;color:#b7cde8;border-radius:99px;padding:3px 7px;margin-left:7px}
.feedback{min-height:42px;color:#d0dced;line-height:1.7;margin-top:13px}
.miniTop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.badge{padding:6px 9px;background:#0d1828;border:1px solid var(--line);border-radius:9px}
.miniIntro{color:var(--muted);line-height:1.7}
.gamebox{
  position:relative;margin-top:18px;min-height:270px;background:#07111e;border:1px solid var(--line);
  border-radius:19px;overflow:hidden
}
.controls{display:flex;justify-content:center;padding:12px;background:#0a1423}
.controls .btn{width:100%;max-width:340px}
.flashMsg{
  position:fixed;left:50%;top:17%;transform:translate(-50%,-10px);
  padding:15px 20px;border-radius:15px;border:1px solid var(--line);background:#10213a;
  color:#eef7ff;z-index:100;opacity:0;pointer-events:none;transition:.18s;text-align:center;
  box-shadow:0 15px 45px rgba(0,0,0,.45);font-weight:900
}
.flashMsg.show{opacity:1;transform:translate(-50%,0)}
.feedbackBox{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  min-width:190px;padding:10px 13px;border-radius:12px;text-align:center;
  font-weight:900;z-index:10;opacity:0;transition:.15s
}
.feedbackBox.show{opacity:1}.feedbackBox.good{background:#12382b;border:1px solid var(--good);color:#8ff0bd}
.feedbackBox.bad{background:#3b1922;border:1px solid var(--bad);color:#ff9dad}
.sideInner{padding:16px}
.avatarCard{
  position:relative;overflow:hidden;background:linear-gradient(180deg,#182c4b,#0f1a2d);
  border:1px solid var(--line);border-radius:19px;padding:15px;text-align:center
}
.avatarGlow{position:absolute;inset:-40px;background:radial-gradient(circle,#6ba8ff19,transparent 58%);pointer-events:none}
.avatarVisual{position:relative;min-height:105px;display:flex;align-items:center;justify-content:center;gap:8px}
.charBody{font-size:66px;line-height:1;filter:drop-shadow(0 5px 8px rgba(0,0,0,.25))}
.charGear{font-size:27px}
.levelText{font-size:13px;color:var(--gold);font-weight:900}
.xpbar{height:8px;background:#09121f;border-radius:999px;overflow:hidden;margin-top:8px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet));transition:.4s}
.evoText{font-size:12px;color:#b3c6df;margin-top:7px;min-height:18px}
.skillTitle{display:flex;justify-content:space-between;align-items:center;margin:16px 0 9px}
.skillTitle b{font-size:13px}.overall{font-size:11px;color:var(--gold);font-weight:900}
.skill{margin:10px 0}
.skillname{display:flex;justify-content:space-between;color:#cfdbed;font-size:12px}
.skillbar{height:7px;background:#09121f;border-radius:99px;overflow:hidden;margin-top:5px}
.skillbar i{display:block;height:100%;transition:.35s}
.skillxp{font-size:10px;color:#70839d;margin-top:2px}
.hint{margin-top:13px;background:#0c1727;border:1px solid var(--line);border-radius:13px;padding:10px;color:#8ea4bf;font-size:11px;line-height:1.6}
.result{text-align:center;padding:45px 28px 50px}
.result .bigLevel{font-size:60px;color:var(--gold);font-weight:950}
.result .type{font-size:29px;font-weight:950;margin:6px 0 12px}
.result p{max-width:740px;margin:0 auto;color:#cfdbed;line-height:1.8}
.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:720px;margin:24px auto;text-align:left}
.resultCard{background:#0e1a2c;border:1px solid var(--line);border-radius:15px;padding:14px}
.resultCard small{color:var(--muted)}.resultCard b{display:block;font-size:20px;margin-top:4px}
.fireworks{position:relative;height:170px;overflow:hidden;margin-bottom:-10px}
.particle{position:absolute;width:8px;height:8px;border-radius:50%;animation:fall 1.8s ease-out forwards;opacity:0}
@keyframes fall{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.4)}}
.levelup{animation:levelup .65s ease}
@keyframes levelup{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.footer{padding:12px;text-align:center;color:#60738d;font-size:11px}

/* telescope mini game */
.telescope{background:linear-gradient(180deg,#081422,#040b13)}
.stars{position:absolute;inset:0;background-image:
  radial-gradient(circle at 12% 21%,#fff 0 1px,transparent 2px),
  radial-gradient(circle at 33% 75%,#e0ebff 0 1px,transparent 2px),
  radial-gradient(circle at 74% 27%,#fff 0 1px,transparent 2px),
  radial-gradient(circle at 90% 62%,#fff 0 1px,transparent 2px),
  radial-gradient(circle at 58% 52%,#dce6ff 0 1px,transparent 2px)}
.reticle{position:absolute;left:50%;top:53%;width:82px;height:82px;transform:translate(-50%,-50%);border:2px solid #6faeffb7;border-radius:50%}
.reticle:before,.reticle:after{content:"";position:absolute;background:#6faeff94}
.reticle:before{width:100%;height:1px;top:50%}.reticle:after{height:100%;width:1px;left:50%}
.planet{position:absolute;left:10%;top:53%;width:28px;height:28px;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff4ad,#ffae43 45%,#cb5d23 100%);box-shadow:0 0 20px #ffb3479a}

/* epicycle */
.epicycle{background:radial-gradient(circle at 50% 50%,#182a47 0 48px,#07111e 49px)}
.orbit{position:absolute;left:50%;top:50%;width:184px;height:184px;border:1px solid #3a5479;border-radius:50%;transform:translate(-50%,-50%)}
.epicircle{position:absolute;left:50%;top:50%;width:70px;height:70px;border:1px dashed #7a9bc3;border-radius:50%;transform:translate(-50%,-50%)}
.epid{position:absolute;width:16px;height:16px;border-radius:50%;background:#ffd36f;box-shadow:0 0 15px #ffd36fa3}
.targetArc{position:absolute;left:50%;top:50%;width:120px;height:120px;border:9px solid transparent;border-top-color:#69a8ff9b;border-radius:50%;transform:translate(-50%,-50%)}

/* memory */
.memoryScene{background:#07111f;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:12px;padding:28px}
.memCard{width:136px;height:132px;background:linear-gradient(180deg,#182941,#0f1d31);border:1px solid #37506f;border-radius:17px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 20px rgba(0,0,0,.18)}
.memIcon{font-size:51px}.memName{font-size:15px;font-weight:900}.countdown{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:31px;font-weight:950;
  color:#ffd76e;background:#091422cc;border:1px solid #324966;border-radius:13px;padding:3px 12px;z-index:5
}
.selectArea{padding:18px;background:#081321;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.memChoice{
  min-height:96px;background:#112038;border:1px solid #2d4563;border-radius:14px;color:#eef6ff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800
}
.memChoice:hover{border-color:#70a8ff;background:#172b49}
.memChoice.correctPick{background:#10362a;border-color:var(--good)}
.memChoice.wrongPick{background:#3b1822;border-color:var(--bad)}
.memChoice:disabled{cursor:default}

/* ellipse */
.ellipseArea{background:#07111e;position:relative}
.ellipsePath{position:absolute;left:50%;top:50%;width:250px;height:150px;border:2px solid #5c84b5;border-radius:50%;transform:translate(-50%,-50%)}
.dataPoint{position:absolute;width:12px;height:12px;background:#ff7184;border-radius:50%;box-shadow:0 0 13px #ff718477}
.cursorPoint{position:absolute;display:none;width:19px;height:19px;background:#68a7ff;border-radius:50%;box-shadow:0 0 16px #68a7ff99;transform:translate(-50%,-50%)}

/* newton */
.newtonArea{background:linear-gradient(180deg,#07111e,#0b1728)}
.ground{position:absolute;left:0;right:0;bottom:35px;height:2px;background:#4d6480}
.target{position:absolute;bottom:37px;width:36px;height:36px;border:2px dashed #ffd66e;border-radius:50%;transform:translateX(-50%)}
.ball{position:absolute;left:8%;bottom:42px;width:18px;height:18px;border-radius:50%;background:#69a8ff;box-shadow:0 0 16px #69a8ffaa;transform:translateX(-50%)}
.range{padding:14px;background:#081321;color:#cbd8ea}
.range input{width:100%}


/* V4 mini-games */
.retrogradeArea{background:linear-gradient(180deg,#071422,#081c2f);overflow:hidden}
.miniCaption{position:absolute;top:17px;left:50%;transform:translateX(-50%);color:#c8d7eb;font-size:14px;z-index:3}
.retroTrack{position:absolute;left:8%;right:8%;top:53%;height:4px;background:#49627e;border-radius:99px}
.retroTrack:before,.retroTrack:after{content:"";position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;background:#6da8ff}
.retroTrack:before{left:0}.retroTrack:after{right:0}
.retroPlanet{position:absolute;top:50%;left:12%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);
 background:radial-gradient(circle at 35% 30%,#fff1ad,#ffad43 45%,#cc5c22 100%);box-shadow:0 0 20px #ffb34799}
.retroDirection{position:absolute;left:50%;top:64%;transform:translateX(-50%);font-size:26px;color:#ffd66e;font-weight:900}
.copernicusArea{background:radial-gradient(circle at 50% 50%,#122849 0 35px,#07111e 36px);min-height:270px;padding:22px}
.copTitle{text-align:center;color:#d7e5f7;font-weight:900}
.copPlanets{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:45px}
.copPlanet{width:105px;min-height:112px;border:1px solid #334a69;background:#10203a;color:#eaf3ff;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.copPlanet span{font-size:38px}.copPlanet:hover{border-color:#6ca9ff;background:#172d4b}
.copPlanet.selected{background:#11382b;border-color:#62dda0;opacity:.65}
.copProgress{text-align:center;color:#9fb2ce;margin-top:17px}
.memoryInstruction{grid-column:1/-1;text-align:center;color:#cbd9ea;margin-bottom:3px;font-size:13px}
.selectArea{width:100%}
.prismArea{background:linear-gradient(180deg,#091625,#07101a);min-height:270px}
.prismCaption{position:absolute;left:50%;top:17px;transform:translateX(-50%);color:#cddced;font-weight:800}
.whiteBeam{position:absolute;left:4%;top:50%;width:37%;height:8px;transform:translateY(-50%);background:white;box-shadow:0 0 14px #ffffff99;border-radius:99px}
.prismTriangle{position:absolute;left:45%;top:50%;width:0;height:0;transform:translate(-50%,-50%);
 border-left:48px solid transparent;border-right:48px solid transparent;border-bottom:86px solid #bce6ff66;filter:drop-shadow(0 0 10px #8fd8ff55)}
.spectrumTarget,.spectrumOut{position:absolute;right:6%;width:31%;height:18px;transform:translateY(-50%);
 background:linear-gradient(90deg,#f33,#ff8c00,#ffe600,#32d35d,#2f8cff,#5b3cff,#b94cff);border-radius:99px;box-shadow:0 0 13px #8fcaff44}
.spectrumTarget{border:2px dashed #fff;background:transparent;height:28px;opacity:.8}
.spectrumOut{transition:top .1s}
.prismRange{padding:13px 16px;background:#081321;color:#cbd8ea}.prismRange input{width:90%;display:block;margin:8px auto 0}


/* V5 timer + redesigned mini-games */
.questionTimer{
  margin:7px 0 15px;
}
.questionTimerHead{
  display:flex;justify-content:space-between;align-items:center;
  color:#a9bad2;font-size:11px;margin-bottom:5px
}
.timerTrack{
  height:9px;border-radius:999px;background:#09121e;border:1px solid #1d2d45;
  overflow:hidden;box-shadow:inset 0 0 7px rgba(0,0,0,.3)
}
.timerTrack i{
  display:block;height:100%;width:100%;
  background:linear-gradient(90deg,#65dba0,#ffd56b,#ff7184);
  transition:width .05s linear
}
.timerDanger{color:#ff8b9a!important;font-weight:900}

/* solar system drag */
.solarSpace{
  min-height:315px;position:relative;background:
    radial-gradient(circle at 50% 35%,#172b4b 0 44px,transparent 45px),
    radial-gradient(circle at 16% 20%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 75% 22%,#dce8ff 0 1px,transparent 2px),
    radial-gradient(circle at 90% 72%,#fff 0 1px,transparent 2px),
    radial-gradient(circle at 28% 75%,#dce8ff 0 1px,transparent 2px),
    linear-gradient(180deg,#06111f,#071526);
  overflow:hidden
}
.sunCore{
  position:absolute;left:5%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6a6,#ffb83e 48%,#db5b24);
  box-shadow:0 0 34px #ffb43b88
}
.solarHint{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#c8d9ed;font-size:12px;font-weight:800;z-index:3}
.dragPlanet{
  position:absolute;width:58px;height:58px;border-radius:50%;border:1px solid #6b86a7;
  display:flex;align-items:center;justify-content:center;color:white;font-size:12px;font-weight:900;
  cursor:grab;user-select:none;touch-action:none;background:#14243a;box-shadow:0 8px 17px #0006
}
.dragPlanet:active{cursor:grabbing;transform:scale(1.08);z-index:15}
.dragPlanet.locked{cursor:default;box-shadow:0 0 0 3px #62dca1aa,0 0 24px #62dca155}
.planetMercury{background:#7d8792}.planetVenus{background:#d69b46}.planetEarth{background:#2678b8}
.planetMars{background:#b7503d}.planetJupiter{background:#a87852}.planetSaturn{background:#d8bd7a}
.planetUranus{background:#65c9d4;color:#06303a}.planetNeptune{background:#416fd7}
.solarLine{
  position:absolute;left:4%;right:4%;bottom:54px;height:62px;border-top:2px solid #55708f;
  display:flex;justify-content:space-between;align-items:flex-start;z-index:4
}
.solarSlot{
  position:relative;width:10.7%;height:58px;border:1px dashed #4a6380;border-top:0;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;color:#8fa5c0;font-size:10px
}
.solarSlot::before{content:"";position:absolute;top:-7px;width:12px;height:12px;border-radius:50%;background:#1b2e48;border:1px solid #6581a0}
.solarSlot.over{background:#123327;border-color:#63dca0}
.solarSlot.done{color:#8ff0bd}
.solarSlot span{font-weight:900}
.solarDragResult{position:absolute;top:41px;left:50%;transform:translateX(-50%);z-index:5;font-weight:900}

/* Kepler */
.keplerArea{
  min-height:315px;position:relative;background:radial-gradient(circle at 23% 50%,#172b47 0 26px,transparent 27px),#07111e;
  overflow:hidden
}
.keplerOrbit{
  position:absolute;left:52%;top:50%;width:390px;height:200px;transform:translate(-50%,-50%);
  border:2px solid #6487b3;border-radius:50%
}
.keplerSun{
  position:absolute;left:calc(52% - 195px);top:50%;width:30px;height:30px;transform:translate(-50%,-50%);
  border-radius:50%;background:#ffba3b;box-shadow:0 0 18px #ffb43b99
}
.keplerPlanet{
  position:absolute;width:24px;height:24px;border-radius:50%;transform:translate(-50%,-50%);
  background:#6ba8ff;box-shadow:0 0 17px #6ba8ffaa
}
.keplerTarget{
  position:absolute;top:50%;width:36px;height:36px;border:2px dashed #ffd76f;border-radius:50%;
  transform:translate(-50%,-50%);opacity:.8
}
.keplerLabels{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px
}
.keplerLabels button{min-width:125px;padding:10px 14px;border-radius:12px;border:1px solid #36506f;background:#13243b;color:#eaf4ff;font-weight:900}
.keplerLabels button:hover{border-color:#6da9ff}
.keplerInfo{position:absolute;top:14px;left:50%;transform:translateX(-50%);color:#cbd9ed;font-size:12px;text-align:center}

/* Dobble */
.dobbleArea{
  min-height:315px;padding:18px;background:radial-gradient(circle at 50% 50%,#132743,#07111e);
  display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center
}
.dobbleCard{
  width:175px;height:175px;margin:auto;border-radius:50%;border:2px solid #4d6d91;background:#11213a;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
  place-items:center;padding:16px;box-shadow:inset 0 0 25px #0005,0 10px 22px #0005
}
.dobbleIcon{
  font-size:31px;cursor:pointer;transition:.1s;filter:drop-shadow(0 2px 2px #0007);
  user-select:none
}
.dobbleIcon:hover{transform:scale(1.18)}
.dobbleIcon.correctPick2{background:#10372b;border:2px solid #63dda1;border-radius:10px;padding:2px}
.dobbleIcon.wrongPick2{background:#3a1822;border:2px solid #ff7184;border-radius:10px;padding:2px}
.dobbleHelp{
  grid-column:1/-1;text-align:center;color:#bdcde1;font-size:12px;margin-top:-3px
}

/* memory adjustments */
.memoryScene{min-height:315px}
.memorySelectWrap{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px;background:#07111f;min-height:260px}
.memChoice{min-height:85px}
@media(max-width:700px){
 .solarLine{left:2%;right:2%}.solarSlot{font-size:8px}
 .dragPlanet{width:48px;height:48px;font-size:10px}
 .dobbleArea{gap:8px}.dobbleCard{width:145px;height:145px}.dobbleIcon{font-size:25px}
 .memorySelectWrap{grid-template-columns:repeat(3,1fr)}
}

function levelFromXP(xp){return Math.max(1,1+Math.floor(xp/7))}
function overallLevel(){return Math.max(1,1+Math.floor(state.totalXP/15))}
function xpPercent(xp){return (xp%15)/15*100}
function evolution(lv){
 if(lv<=1)return {body:"🧑‍🔬",gear:"",text:"신입 연구생"};
 if(lv<=2)return {body:"🧑‍🔬",gear:"🔎",text:"관찰 연구생"};
 if(lv<=3)return {body:"🧑‍🔬",gear:"🔭",text:"천문 관측자"};
 if(lv<=4)return {body:"🧑‍🔬",gear:"📚",text:"과학 탐구자"};
 if(lv<=5)return {body:"🧑‍🔬",gear:"🧥",text:"독립 연구자"};
 if(lv<=6)return {body:"🧑‍🔬",gear:"🧪",text:"실험 과학자"};
 if(lv<=7)return {body:"🧑‍🔬",gear:"⚡",text:"이론 연구자"};
 if(lv<=8)return {body:"🧑‍🔬",gear:"🌟",text:"과학의 선구자"};
 return {body:"🧑‍🔬",gear:"🏆✨",text:"위대한 과학자"}
}
function clearTimers(){timers.forEach(clearTimeout);timers=[];stopTopTimer();stopMiniTimer()}
function toast(msg,good=true){
 const el=document.getElementById("flashMsg");el.textContent=msg;
 el.style.borderColor=good?"#5fdda0":"#ff7184";
 el.classList.add("show");
 clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("show"),1100)
}
function addSkill(key,delta,rerender=true){
 const oldLevel=levelFromXP(Math.max(0,state.skills[key]));
 state.skills[key]=Math.max(0,state.skills[key]+delta);
 state.totalXP=Math.max(0,state.totalXP+Math.max(0,delta));
 const newLevel=levelFromXP(state.skills[key]);
 if(delta>0){
   if(newLevel>oldLevel){
     toast(`✨ ${SKILLS[key].name} 레벨업!  Lv.${newLevel}`,true);
     document.getElementById("avatarCard")?.classList.add("levelup");
     timers.push(setTimeout(()=>document.getElementById("avatarCard")?.classList.remove("levelup"),700));
   }else toast(`+${delta} ${SKILLS[key].name}`,true);
 }else if(delta<0)toast(`${delta} ${SKILLS[key].name}`,false);
 if(rerender) renderSide();
}
function addSkills(obj,rerender=true){
 for(const [k,v] of Object.entries(obj)) addSkill(k,v,false);
 if(rerender) renderSide();
}
function renderSide(){

     <div class="avatarVisual"><div class="charBody">${ev.body}</div><div class="charGear">${ev.gear}</div></div>
     <div class="levelText">SCIENTIST LEVEL ${lv}</div>
     <div class="xpbar"><i style="width:${pct}%"></i></div>
     <div class="evoText">${ev.text} · ${state.totalXP} XP</div>
   </div>
   <div class="skillTitle"><b>과학자 능력치</b><span class="overall">문제마다 실시간 반영</span></div>`;
 for(const [k,xp] of Object.entries(state.skills)){
   const lv2=levelFromXP(xp);
   html+=`<div class="skill">
      <div class="skillname"><span>${SKILLS[k].name}</span><b>Lv.${lv2}</b></div>
      <div class="skillbar"><i style="width:${xpPercent(xp)}%;background:${SKILLS[k].color}"></i></div>
      <div class="skillxp">${xp} XP</div>
   </div>`;
 }
 html+=`<div class="hint">문제 선택과 미니게임 결과에 따라 능력치가 올라가거나 내려갑니다. 마지막에 어떤 과학자로 성장했는지 확인하세요.</div></div>`;
 document.getElementById("side").innerHTML=html;
}

 else renderResult();
 renderSide();
}

function initRetrograde(){
 document.getElementById("miniStage").innerHTML=`<div class="gamebox retrogradeArea" id="retroBox">
   <div class="miniCaption" id="retroCaption">행성이 정상적으로 움직입니다. <b>방향이 바뀌는 순간</b> 버튼을 누르세요!</div>
   <div class="retroTrack"><div class="retroPlanet" id="retroPlanet"></div></div>
   <div class="retroDirection" id="retroDirection">→</div>
 </div>
 <div class="controls"><button class="btn" onclick="fireRetrograde()">↩️ 역행 시작을 포착!</button></div>`;
 window.retroPos=12;window.retroDir=1;window.retroStart=performance.now();
 window.retroReverseAt=null;window.retroClicked=false;
 const delay=1400+Math.random()*1100;
 window.retroSwitchTimer=setTimeout(()=>{
   if(window.retroClicked)return;
   window.retroReverseAt=performance.now();window.retroDir=-1;
   const dir=document.getElementById("retroDirection");if(dir)dir.textContent="←";
   const cap=document.getElementById("retroCaption");if(cap)cap.innerHTML="🔴 <b>역행 시작!</b> 지금 바로 눌러 보세요!";
 },delay);
 timers.push(window.retroSwitchTimer);
 function loop(){
   if(!document.getElementById("retroPlanet") || window.retroClicked)return;
   window.retroPos+=window.retroDir*(window.retroDir>0?0.34:0.48);
   if(window.retroPos>88)window.retroPos=88;
   if(window.retroPos<12)window.retroPos=12;
   document.getElementById("retroPlanet").style.left=window.retroPos+"%";
   window.retroRAF=requestAnimationFrame(loop);
 }
 window.retroRAF=requestAnimationFrame(loop);
 startMiniTimer(5,()=>retrogradeTimeout());
}
function reactionMessage(percent){
 if(percent>=90)return "⚡ 초고속 반사신경!";
 if(percent>=70)return "⚡ 매우 빠른 반응!";
 if(percent>=50)return "⚡ 좋은 반응!";
 if(percent>0)return "⚡ 반응 성공!";
 return "⚡ 반응 기회를 놓쳤어요!";
}
function fireRetrograde(){
 if(window.retroClicked)return;
 window.retroClicked=true;cancelAnimationFrame(window.retroRAF);clearTimeout(window.retroSwitchTimer);stopMiniTimer();
 let reaction=0;
 if(window.retroReverseAt){
   const ms=Math.max(0,performance.now()-window.retroReverseAt);
   reaction=Math.max(0,Math.round(100-ms/8));
 }
 const rb=document.getElementById("retroBox");
 rb.insertAdjacentHTML("beforeend",`<div class="feedbackBox ${reaction>=50?"good":"bad"} show">${reactionMessage(reaction)} <b>반사신경 +${reaction}%</b></div>`);
 const xp=reaction>=80?3:reaction>=50?2:reaction>0?1:0;
 if(xp)addSkill("observe",xp);
 state.score+=Math.round(reaction/20);state.miniData.push(reaction);
 timers.push(setTimeout(nextMini,1100));
}
function retrogradeTimeout(){
 if(window.retroClicked)return;
 window.retroClicked=true;cancelAnimationFrame(window.retroRAF);clearTimeout(window.retroSwitchTimer);

 rb.insertAdjacentHTML("beforeend",`<div class="feedbackBox bad show">⏰ 반응 기회를 놓쳤어요 · <b>반사신경 +0%</b></div>`);

function initSolarDrag(){

   {name:"지구",cls:"planetEarth",icon:"🌍",slot:2},
   {name:"화성",cls:"planetMars",icon:"♂",slot:3},
   {name:"목성",cls:"planetJupiter",icon:"♃",slot:4},
   {name:"토성",cls:"planetSaturn",icon:"♄",slot:5},
   {name:"천왕성",cls:"planetUranus",icon:"♅",slot:6},
   {name:"해왕성",cls:"planetNeptune",icon:"♆",slot:7}
 ];
 window.solarPlanets=planets;window.solarDone=0;window.solarFinished=false;
 const stage=document.getElementById("miniStage");
 stage.innerHTML=`<div class="gamebox solarSpace" id="solarSpace">
   <div class="solarHint">행성을 마우스로 끌어서 1~8번 위치에 태양과 가까운 순서대로 놓으세요.</div>
   <div class="sunCore"></div>
   <div class="solarDragResult" id="solarDragResult">1~8번 위치에 드래그하세요</div>
   <div class="solarLine">${planets.map((p,i)=>`<div class="solarSlot" data-slot="${i}"><span>${i+1}</span></div>`).join("")}</div>
   ${planets.map((p,i)=>{
      const left=12+(i%4)*21+(Math.random()*5-2.5),top=30+Math.floor(i/4)*24+(Math.random()*7-3.5);
      return `<div class="dragPlanet ${p.cls}" data-name="${p.name}" data-slot="${p.slot}" style="left:${left}%;top:${top}%">${p.icon}<span style="position:absolute;bottom:-17px;font-size:9px">${p.name}</span></div>`
   }).join("")}
 </div>
 <div class="controls"><button class="btn" onclick="finishSolarEarly()">✅ 배치 완료 확인</button></div>`;
 const space=document.getElementById("solarSpace");
 space.querySelectorAll(".dragPlanet").forEach(attachSolarPointerDrag);
 window.solarTimeLimit=15;startMiniTimer(15,()=>solarTimeout());
}
function attachSolarPointerDrag(el){
 el.addEventListener("pointerdown",e=>{
   if(el.classList.contains("locked")||window.solarFinished)return;
   e.preventDefault();el.setPointerCapture?.(e.pointerId);el.classList.add("dragging");
   const space=document.getElementById("solarSpace"),rect=space.getBoundingClientRect();
   const move=ev=>{
     const x=Math.max(3,Math.min(97,((ev.clientX-rect.left)/rect.width)*100));
     const y=Math.max(10,Math.min(86,((ev.clientY-rect.top)/rect.height)*100));
     el.style.left=x+"%";el.style.top=y+"%";
     highlightSolarSlot(ev.clientX,ev.clientY);
   };
   const up=ev=>{
     el.releasePointerCapture?.(ev.pointerId);el.classList.remove("dragging");
     const target=findSolarSlotAt(ev.clientX,ev.clientY);
     space.querySelectorAll(".solarSlot").forEach(s=>s.classList.remove("over"));
     if(target)placeSolar(el.dataset.name,target,el);else snapSolarBack(el);
     el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);
   };
   el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
 });
}
function findSolarSlotAt(x,y){
 return [...document.querySelectorAll(".solarSlot")].find(slot=>{
   const r=slot.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;
 })||null;
}
function highlightSolarSlot(x,y){
 [...document.querySelectorAll(".solarSlot")].forEach(slot=>{
   const r=slot.getBoundingClientRect();slot.classList.toggle("over",x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom&&!slot.classList.contains("done"));
 });
}
function snapSolarBack(el){
 const p=window.solarPlanets.find(x=>x.name===el.dataset.name),i=p?.slot??0;
 el.style.left=(12+(i%4)*21)+"%";el.style.top=(30+Math.floor(i/4)*24)+"%";
}
function placeSolar(name,slot,planet){
 if(!name||slot.classList.contains("done")||window.solarFinished)return;
 const expected=Number(slot.dataset.slot),actual=Number(planet.dataset.slot);
 if(expected!==actual){toast(`❌ ${name}의 위치가 아닙니다.`,false);snapSolarBack(planet);return;}
 const space=document.getElementById("solarSpace"),r=space.getBoundingClientRect(),sr=slot.getBoundingClientRect();
 planet.style.left=((sr.left+sr.width/2-r.left)/r.width*100)+"%";planet.style.top=((sr.top+sr.height/2-r.top)/r.height*100)+"%";
 planet.classList.add("locked");slot.classList.add("done");
 document.getElementById("solarDragResult").textContent=`✅ ${name} 배치 완료`;
 window.solarDone++;state.score+=2;addSkill("compare",2);
 addMiniTime(2);
 const sr2=document.getElementById("solarDragResult");
 if(sr2&&window.solarDone<8)sr2.textContent=`✅ ${pText} 배치 완료 · 제한시간 +2초`;
 if(window.solarDone===8){
   window.solarFinished=true;stopMiniTimer();document.getElementById("solarDragResult").textContent="🎉 8개 행성을 모두 배치했습니다!";
   state.miniData.push(100);timers.push(setTimeout(finishStageMini,900));
 }
}
function finishSolarEarly(){
 if(window.solarFinished)return;
 if(window.solarDone===8){window.solarFinished=true;stopMiniTimer();state.miniData.push(100);finishStageMini()}
 else toast(`아직 ${8-window.solarDone}개 행성이 남았습니다.`,false);
}
function solarTimeout(){
 if(window.solarFinished)return;
 window.solarFinished=true;const acc=window.solarDone/8*100;state.miniData.push(acc);
 toast(`⏰ 시간 종료 · ${window.solarDone}/8 배치 완료`,false);addSkill("compare",Math.max(0,Math.floor(window.solarDone/3)));
 timers.push(setTimeout(finishStageMini,1000));
}

function clearPairState(){

}

function flipPair(index){
 const ps=window.pairState;
 if(!ps || ps.finished || ps.locked)return;
 const card=document.getElementById(`pair-${index}`);
 if(!card || ps.matched.has(index) || card.classList.contains("flipped"))return;

 card.classList.add("flipped");
 if(ps.first===null){
   ps.first=index;
   return;
 }
 ps.second=index;
 ps.locked=true;

 const first=document.getElementById(`pair-${ps.first}`);
 const second=document.getElementById(`pair-${ps.second}`);
 const same=first.dataset.key===second.dataset.key;
 const result=document.getElementById("pairResult");

 if(same){
   first.classList.add("matched");
   second.classList.add("matched");
   ps.matched.add(ps.first);
   ps.matched.add(ps.second);
   ps.matches++;
   ps.first=null;ps.second=null;ps.locked=false;
   addSkill("compare",1,false);
   result.innerHTML=`✅ 정답! ${ps.matches}/4쌍 · 비교능력 <b>+1</b>`;
   renderSide();

   if(ps.matches===4){
     ps.finished=true;
     stopMiniTimer();
     const elapsed=(performance.now()-ps.startedAt)/1000;
     const remain=Math.max(0,30-elapsed);
     const bonus=Math.min(3,Math.max(0,Math.floor(remain/8)));
     if(bonus>0)addSkill("compare",bonus,false);
     renderSide();
     state.score+=4+bonus;
     result.innerHTML=`🎉 4쌍 완성! <b>${elapsed.toFixed(1)}초</b> · 빠른 시간 보너스 <b>+${bonus}</b>`;
     state.miniData.push(100);
     timers.push(setTimeout(nextMini,1200));
   }
 }else{
   result.innerHTML=`❌ 오답입니다. 다시 확인해 보세요.`;
   timers.push(setTimeout(()=>{
     first.classList.remove("flipped");
     second.classList.remove("flipped");
     ps.first=null;ps.second=null;ps.locked=false;
     result.innerHTML=`남은 카드에서 같은 짝을 찾아보세요.`;
   },650));
 }
}

 const stage=document.getElementById("miniStage");
 stage.innerHTML=`<div class="gamebox dobbleArea" id="dobbleBox">
   <div class="dobbleHelp">네 원형 카드에 <b>모두 들어 있는 단 하나의 공통 아이콘</b>을 찾아 클릭하세요. 각 원판에는 정확히 <b>6개</b>가 있습니다.</div>
   ${cards.map(arr=>`<div class="dobbleCard">${arr.map(icon=>`<span class="dobbleIcon" onclick="pickDobble(this,'${icon}')">${icon}</span>`).join("")}</div>`).join("")}
 </div>`;
 startMiniTimer(15,()=>dobbleTimeout());
}
function pickDobble(el,icon){
 if(window.dobbleFound)return;
 window.dobbleFound=true;stopMiniTimer();
 const box=document.getElementById("dobbleBox");
 const correct=icon===window.dobbleCommon;
 el.classList.add(correct?"correctPick2":"wrongPick2");
 if(correct){
   box.insertAdjacentHTML("beforeend",`<div class="feedbackBox good show">✅ 정답! <b>논리추론능력 +3</b></div>`);
   addSkill("logic",3);state.score+=3;state.miniData.push(100);
 }else{
   box.insertAdjacentHTML("beforeend",`<div class="feedbackBox bad show">❌ 오답! <b>논리추론능력 -1</b></div>`);
   addSkill("logic",-1);state.miniData.push(0);
 }
 timers.push(setTimeout(nextMini,900))
}
function dobbleTimeout(){
 if(window.dobbleFound)return;
 window.dobbleFound=true;stopMiniTimer();
 const box=document.getElementById("dobbleBox");
 box.insertAdjacentHTML("beforeend",`<div class="feedbackBox bad show">⏰ 시간 종료! · <b>논리추론능력 -1</b></div>`);
 addSkill("logic",-1);state.miniData.push(0);timers.push(setTimeout(nextMini,900))
}

function nextMini(){
 if(MINI[state.stage].type==="solarDrag"){
   finishStageMini();return;
 }
 const maxRounds=MINI[state.stage].type==="pairs"?3:5;
 if(state.miniRound<maxRounds){state.miniRound++;state.miniData=[];render()}
 else finishStageMini()
}
function finishStageMini(){
 const avg=state.miniData.reduce((a,b)=>a+b,0)/state.miniData.length;
 state.miniAverage=avg;
 addSkill(MINI[state.stage].skill,avg>=70?2:1);
 state.score+=Math.round(avg/20);
 if(state.stage<STAGES.length-1){
   state.screen="stageComplete";render()
 }else{
   state.screen="result";render()
 }
}

function bestType(){
 const entries=Object.entries(state.skills).sort((a,b)=>b[1]-a[1]);
 const key=entries[0][0];
 return {
   observe:["관찰을 따라가는 과학자","현상을 직접 보고 세밀하게 기록하는 힘이 두드러졌습니다."],
   verify:["검증을 중시하는 과학자","한 번의 결과보다 반복 확인과 반론 검토를 중요하게 여겼습니다."],
   evidence:["증거를 모으는 과학자","새로운 자료와 관측 결과를 판단의 핵심 근거로 삼았습니다."],
   compare:["연결하고 비교하는 과학자","서로 다른 설명과 연구 결과를 비교하고 연결했습니다."],
   logic:["논리로 모델을 세우는 과학자","관측을 설명하는 모델과 논리적 관계를 찾는 데 강점을 보였습니다."],
   authority:["독립적으로 판단하는 과학자","권위와 증거를 구분하면서 자신의 판단을 만들어 갔습니다."]
 }[key]
}
function fireworks(){
 return `<div class="fireworks">${Array.from({length:55},(_,i)=>{
  const x=(Math.random()*700-350).toFixed(0)+"px",y=(Math.random()*170+35).toFixed(0)+"px";
  const left=(50+Math.random()*16-8).toFixed(1)+"%";return `<i class="particle" style="left:${left};top:20px;--x:${x};--y:${y};animation-delay:${(Math.random()*.5).toFixed(2)}s"></i>`
 }).join("")}</div>`
}
function renderResult(){
 const lv=overallLevel(),ev=evolution(lv),[type,desc]=bestType();
 const sorted=Object.entries(state.skills).sort((a,b)=>b[1]-a[1]);
 document.getElementById("app").innerHTML=`<section class="result">
   ${fireworks()}
   <div class="eyebrow">FINAL SCIENTIST PROFILE</div>
   <h2 class="title">🎉 축하합니다!</h2>
   <div class="bigLevel">SCIENCE Lv.${lv}</div>
   <div style="font-size:80px;line-height:1">${ev.body} ${ev.gear}</div>
   <div class="type">「${type}」</div>
   <p>${desc}<br>5명의 과학자와 함께 탐구하면서 당신만의 과학자 능력치를 키웠습니다.</p>
   <div class="resultGrid">${sorted.map(([k,xp])=>`<div class="resultCard"><small>${SKILLS[k].name}</small><b>Lv.${levelFromXP(xp)} · ${xp} XP</b></div>`).join("")}</div>
   <div class="quote"><b>수업 질문</b><br>과학자는 자신의 신념을 언제 유지하고, 언제 수정해야 할까?<br>
   <span style="color:#9caec8">게임에서의 선택과 실제 과학자의 행동을 비교해 봅시다.</span></div>
   <div style="margin-top:20px;color:#9caec8">총점 ${state.score} · 과학사 문제 정답 ${state.correctTotal} / 25</div>
   <div style="margin-top:25px"><button class="btn" onclick="startGame()">다시 플레이하기</button></div>
 </section>`;
}

function startTopTimer(seconds,onEnd){
 stopTopTimer();
 const start=performance.now(),bar=document.getElementById("timerBar"),txt=document.getElementById("timerText");
 if(!bar||!txt)return;
 function tick(){
   const elapsed=(performance.now()-start)/1000,remain=Math.max(0,seconds-elapsed),pct=Math.max(0,remain/seconds*100);
   bar.style.width=pct+"%";txt.textContent=remain.toFixed(1)+"초";
   if(remain<=1)txt.classList.add("timerDanger");else txt.classList.remove("timerDanger");
   if(remain<=0){stopTopTimer();onEnd()}
   else window.topTimerRAF=requestAnimationFrame(tick);
 }
 window.topTimerRAF=requestAnimationFrame(tick)
}
function stopTopTimer(){
 if(window.topTimerRAF)cancelAnimationFrame(window.topTimerRAF);
 window.topTimerRAF=null;
}
function startMiniTimer(seconds,onEnd){
 stopMiniTimer();
 window.miniTimerTotal=seconds;
 window.miniTimerDeadline=performance.now()+seconds*1000;
 window.miniTimerEndCallback=onEnd;
 const miniStage=document.getElementById("miniStage");
 if(!miniStage)return;
 const header=document.querySelector(".miniTop");
 const timer=document.createElement("div");
 timer.className="questionTimer";
 timer.innerHTML=`<div class="questionTimerHead"><span>⏱ 제한 시간</span><span id="miniTimerText">${seconds.toFixed(1)}초</span></div><div class="timerTrack"><i id="miniTimerBar"></i></div>`;
 header?.after(timer);
 function tick(){
   const remain=Math.max(0,(window.miniTimerDeadline-performance.now())/1000);
   const total=window.miniTimerTotal||seconds;
   const pct=Math.max(0,Math.min(100,(remain/total)*100));
   const bar=document.getElementById("miniTimerBar"),txt=document.getElementById("miniTimerText");
   if(!bar||!txt)return;
   bar.style.width=pct+"%";txt.textContent=remain.toFixed(1)+"초";
   if(remain<=1)txt.classList.add("timerDanger");else txt.classList.remove("timerDanger");
   if(remain<=0){stopMiniTimer();window.miniTimerEndCallback?.()}
   else window.miniTimerRAF=requestAnimationFrame(tick);
 }
 window.miniTimerRAF=requestAnimationFrame(tick)
}
function addMiniTime(seconds){
 if(!window.miniTimerDeadline)return;
 window.miniTimerDeadline+=seconds*1000;
 const remaining=Math.max(0,(window.miniTimerDeadline-performance.now())/1000);
 const txt=document.getElementById("miniTimerText");
 if(txt)txt.textContent=remaining.toFixed(1)+"초";
}
function stopMiniTimer(){
 if(window.miniTimerRAF)cancelAnimationFrame(window.miniTimerRAF);
 window.miniTimerRAF=null;
 window.miniTimerDeadline=null;
 window.miniTimerEndCallback=null;
}

function toggleSound(){state.sound=!state.sound;document.getElementById("soundBtn").textContent=state.sound?"🔊":"🔇"}

render();
</script>
</body>
</html>
